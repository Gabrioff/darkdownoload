<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicBot Premium</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            primary: '#6366f1',
                            secondary: '#a855f7'
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F19;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent 40%);
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .search-glow:focus-within {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="flex flex-col pb-12 relative overflow-x-hidden">

    <!-- Navbar -->
    <header class="glass-panel sticky top-0 z-20 px-6 py-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-primary to-brand-secondary p-[2px]">
                    <div class="w-full h-full bg-brand-dark rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                    </div>
                </div>
                <h1 class="text-xl font-bold tracking-wide">Music<span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-primary to-brand-secondary">Bot</span></h1>
            </div>
            <div id="userInfo" class="text-sm text-gray-400 font-medium"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full px-4 pt-8">
        
        <div class="text-center mb-10 animate-float">
            <h2 class="text-3xl sm:text-4xl font-bold mb-3">Descubre & Descarga</h2>
            <p class="text-gray-400 text-sm sm:text-base">Escribe, pega un enlace o usa el micrófono para reconocer música.</p>
        </div>

        <!-- Buscador Inteligente Único con Micrófono -->
        <form id="searchForm" class="relative max-w-2xl mx-auto mb-12 z-10" onsubmit="handleUniversalSearch(event)">
            <div class="glass-panel search-glow rounded-2xl flex items-center p-2 transition-all duration-300">
                
                <!-- Botón Micrófono Shazam -->
                <button type="button" id="btnMic" onclick="startAudioRecognition()" class="p-2 text-gray-400 hover:text-brand-secondary transition-colors rounded-full hover:bg-white/5 relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    <span id="micPulse" class="absolute inset-0 rounded-full bg-brand-secondary/50 animate-pulse-fast hidden"></span>
                </button>

                <input type="text" id="searchInput" placeholder="Buscar música, video o enlace..." class="w-full bg-transparent border-none text-white px-3 py-3 focus:outline-none focus:ring-0 placeholder-gray-500 text-lg" required autocomplete="off">
                
                <button type="submit" class="bg-gradient-to-r from-brand-primary to-brand-secondary hover:opacity-90 text-white p-3 rounded-xl transition-all shadow-lg shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
            </div>
        </form>

        <!-- Loading State -->
        <div id="loadingState" class="hidden flex-col items-center justify-center py-12 max-w-2xl mx-auto">
            <div class="w-12 h-12 border-4 border-brand-primary/30 border-t-brand-primary rounded-full animate-spin mb-4"></div>
            <p id="loadingText" class="text-brand-primary font-medium animate-pulse text-sm">Buscando en YouTube...</p>
        </div>

        <!-- Results Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 relative z-0">
            <!-- Cards go here -->
        </div>
    </main>

    <!-- Modal de Vista Previa y Descarga INSTANTÁNEO -->
    <div id="downloadModal" class="fixed inset-0 bg-brand-dark/90 backdrop-blur-md z-50 hidden flex-col items-center justify-end sm:justify-center p-0 sm:p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 transform translate-y-full sm:translate-y-10 transition-transform duration-300 shadow-2xl border-t border-white/10" id="modalContent">
            
            <div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-6 sm:hidden"></div>

            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold text-white">Vista Previa & Descarga</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-full p-2 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Opciones Visibles Instantáneamente -->
            <div class="flex flex-col w-full">
                
                <!-- Reproductor de Video -->
                <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-lg mb-4 bg-black/50 border border-white/10">
                    <iframe id="previewIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="mb-4 text-center">
                    <h4 id="modalTitle" class="text-base font-bold text-white line-clamp-2 leading-snug mb-1">...</h4>
                    <p id="modalAuthor" class="text-sm text-brand-primary truncate">...</p>
                </div>

                <div class="space-y-3 mt-2">
                    <!-- Botón Audio (Link directo al Backend que redirecciona) -->
                    <a id="btnAudio" href="#" target="_blank" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:opacity-90 text-white py-3.5 px-4 rounded-xl font-semibold flex justify-between items-center transition-all shadow-lg">
                        <span class="flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                            Descargar Audio (MP3/M4A)
                        </span>
                        <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </a>

                    <!-- Botón Video (Link directo al Backend que redirecciona) -->
                    <a id="btnVideo" href="#" target="_blank" class="w-full bg-gradient-to-r from-red-500 to-orange-500 hover:opacity-90 text-white py-3.5 px-4 rounded-xl font-semibold flex justify-between items-center transition-all shadow-lg">
                        <span class="flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Descargar Video (MP4)
                        </span>
                        <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 glass-panel border-l-4 px-6 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-3 text-sm font-medium transition-all duration-300 opacity-0 -translate-y-full">
        <span id="toastIcon"></span>
        <span id="toastMessage" class="text-white">Mensaje</span>
    </div>

    <script>
        // ⚠️ Asegúrate de que esta sea tu URL real de Vercel ⚠️
        const BACKEND_URL = "https://darkdownoload.vercel.app";

        const tg = window.Telegram.WebApp;
        tg.expand();
        
        if (tg.initDataUnsafe?.user) {
            document.getElementById('userInfo').innerHTML = `<span class="text-gray-500">Hola,</span> <span class="text-white">${tg.initDataUnsafe.user.first_name}</span>`;
        }

        function formatTime(seconds) {
            if(!seconds) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if(h > 0) return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastIcon').innerHTML = isError ? '🔴' : '🟢';
            toast.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            document.getElementById('toastMessage').innerText = message;
            
            toast.classList.remove('-translate-y-full', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-full', 'opacity-0');
            }, 3500);
        }

        // --- SISTEMA SHAZAM ---
        let mediaRecorder;
        let audioChunks = [];

        async function startAudioRecognition() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener("stop", async () => {
                    document.getElementById('micPulse').classList.add('hidden');
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64Audio = reader.result.split(',')[1];
                        await recognizeMusicInServer(base64Audio);
                    };
                    
                    stream.getTracks().forEach(track => track.stop());
                });

                mediaRecorder.start();
                document.getElementById('micPulse').classList.remove('hidden');
                document.getElementById('searchInput').placeholder = "Escuchando... 🎵";
                
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                        document.getElementById('searchInput').placeholder = "Analizando audio...";
                    }
                }, 5000);

            } catch (err) {
                showToast("Debes dar permisos de micrófono para usar esta función.", true);
            }
        }

        async function recognizeMusicInServer(base64Audio) {
            try {
                showToast("Analizando canción...");
                const response = await fetch(`${BACKEND_URL}/api/recognize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audioBase64: base64Audio })
                });
                const data = await response.json();
                if (response.ok && data.title) {
                    const foundQuery = `${data.title} ${data.artist}`;
                    document.getElementById('searchInput').value = foundQuery;
                    showToast(`¡Encontrada! ${data.title}`);
                    document.getElementById('searchForm').dispatchEvent(new Event('submit'));
                } else {
                    throw new Error("No reconocida");
                }
            } catch (error) {
                showToast(error.message, true);
                document.getElementById('searchInput').placeholder = "Buscar música, video o enlace...";
            }
        }

        // --- BUSCADOR ---
        async function handleUniversalSearch(e) {
            e.preventDefault();
            const inputField = document.getElementById('searchInput');
            const query = inputField.value.trim();
            if (!query) return;

            inputField.blur();
            document.getElementById('resultsGrid').innerHTML = '';
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('loadingState').classList.add('flex');

            const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = query.match(ytRegex);

            if (match && match[1]) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('loadingState').classList.remove('flex');
                openDownloadModal(match[1], "Video desde Enlace", "YouTube");
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error("Error del servidor");
                const videos = await response.json();
                renderResults(videos);
            } catch (error) {
                showToast("Fallo en la búsqueda.", true);
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('loadingState').classList.remove('flex');
            }
        }

        function renderResults(videos) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';
            if (!videos || videos.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">No se encontraron resultados.</p>`;
                return;
            }

            videos.forEach(video => {
                if (!video.id) return;
                const safeTitle = video.title ? video.title.replace(/"/g, '&quot;') : 'Sin Título';
                const safeAuthor = video.author ? video.author.replace(/"/g, '&quot;') : 'Desconocido';

                const card = document.createElement('div');
                card.className = "glass-panel rounded-2xl overflow-hidden hover:-translate-y-1 hover:shadow-lg transition-all duration-300 group cursor-pointer border border-transparent hover:border-brand-primary/30 flex flex-col";
                // Al hacer clic, abre el modal INMEDIATAMENTE
                card.onclick = () => openDownloadModal(video.id, safeTitle, safeAuthor);

                card.innerHTML = `
                    <div class="relative w-full aspect-video overflow-hidden">
                        <img src="${video.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute bottom-2 right-2 bg-black/80 backdrop-blur-sm text-white text-[11px] px-2 py-1 rounded-md font-medium shadow-lg">${formatTime(video.duration)}</span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-sm font-semibold leading-snug mb-1 line-clamp-2 text-white group-hover:text-brand-primary transition-colors">${safeTitle}</h3>
                            <p class="text-xs text-gray-400 truncate">${safeAuthor}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- MODAL INSTANTÁNEO ---
        function openDownloadModal(videoId, title, author) {
            const modal = document.getElementById('downloadModal');
            const content = document.getElementById('modalContent');
            
            // 1. Mostrar la ventana al instante
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('translate-y-full', 'sm:translate-y-10');
            }, 10);

            // 2. Cargar textos e iframe
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalAuthor').innerText = author;
            document.getElementById('previewIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=0`;

            // 3. Asignar los enlaces a los botones para que el navegador haga el trabajo al hacer clic
            document.getElementById('btnAudio').href = `${BACKEND_URL}/api/download-audio?v=${videoId}`;
            document.getElementById('btnVideo').href = `${BACKEND_URL}/api/download-video?v=${videoId}`;
        }

        function closeModal() {
            const modal = document.getElementById('downloadModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full', 'sm:translate-y-10');
            
            document.getElementById('previewIframe').src = ''; // Apagar video
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        document.getElementById('downloadModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
